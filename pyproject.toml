[project]
name = "videomesh"
version = "0.0.1"
description = "Productor de paquetes de reconstruccion para la frontera con SoftSight"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[project.scripts]
videomesh = "videomesh.cli.app:main"

[project.optional-dependencies]
# La capacidad de malla —limpiar, decimar, convertir— va en su propio extra: es un
# proveedor de produccion y no una dependencia del nucleo, que sigue siendo pydantic
# y nada mas. `dev` la incluye porque las etapas B se prueban de verdad y no se saltan.
malla = ["pymeshlab>=2024.12"]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pymeshlab>=2024.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videomesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# `docs/` es prosa. Ruff 0.16 formatea los bloques de codigo de los markdown y
# reescribiria ejemplos que estan escritos para leerse, no para ejecutarse.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Los modelos generados los escribe scripts/generar_modelos.py y los compara byte
# a byte una prueba: quien manda en su forma es el generador, no el formateador.
# Se siguen mirando de verdad (F, I, B); solo se les perdona el ancho de linea,
# que en una union de doce ramas no dice nada.
[tool.ruff.lint.per-file-ignores]
"src/videomesh/contracts/modelos/*.py" = ["E501"]

[tool.ruff.format]
exclude = ["src/videomesh/contracts/modelos/*.py"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

# `pymeshlab` es un binding de C++ sin stubs ni marcador `py.typed`, asi que mypy no
# puede analizarlo. Se declara aqui y no con un `type: ignore` en cada llamada: la
# frontera con lo que no tiene tipos es una, y se escribe una vez.
[[tool.mypy.overrides]]
module = ["pymeshlab", "pymeshlab.*"]
ignore_missing_imports = true
